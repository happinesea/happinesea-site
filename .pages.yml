              label: TURBO PiX (turbo-pix)
      - name: gallery
        label: 追加画像（本文の後に表示）
        type: object
        list:
          collapsible:
            summary: '{fields.alt}'
        description: 画像を追加し、説明を入力。項目のドラッグで並べ替え、項目メニューから削除できます。本文中への配置は本文エディタの / Image を使います。
        fields:
          - name: src
            label: 画像
            type: image
            required: true
            options:
              media: article_images
          - name: alt
            label: 画像の説明
            type: string
            required: true
      - name: body
        label: 本文（画像挿入：空行で半角 / → Image）
        type: rich-text
        options:
          format: markdown
          media: article_images
          switcher: true
        description: '画像を本文へ入れるには Editor で空行をクリックし、半角 / を入力 → Image → 画像を選択または Upload → Select。挿入した画像をクリック → ALT → 説明を入力 → Save alt text。その後に記事の Save を押します。画像をクリックすればALTを再編集できます。文字選択時の書式ツールバーには画像挿入ボタンはありません。'
  - name: article_tags
    label: 記事タグ
    type: collection
    path: src/content/article-tags
    format: yaml
    filename: '{fields.id}.yml'
    subfolders: false
    operations:
      rename: false
    view:
      primary: name
    fields:
      - name: id
        type: uuid
        hidden: true
      - name: name
        label: タグ名
        type: string
        required: true
        pattern: ^[^\s/\\.][^/\\]*$
settings:
  hide: true
  content:
    merge: true
